[workspace]
resolver = "2"
members = ["crates/*", "experiments/e1-shell-loop", "experiments/e2-callback", "experiments/e3-servo"]
default-members = ["crates/bulwark-engine", "crates/bulwark-runtime", "crates/bulwark-shell"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
bulwark-engine = { path = "crates/bulwark-engine" }
bulwark-runtime = { path = "crates/bulwark-runtime" }
cljrs-runtime = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61", default-features = false, features = ["regex-full"] }
cljrs-stdlib = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61", default-features = false, features = ["regex-full"] }
cljrs-reader = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61" }
cljrs-value = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61", default-features = false, features = ["regex-full"] }
cljrs-gc = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61" }
cljrs-async = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61", default-features = false }
cljrs-nrepl = { git = "https://github.com/csm/clojurust", rev = "c74e54df68185a3852dcd6d6682af5f0f98c1d61", default-features = false }
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit"] }
tokio = { version = "1", features = ["rt", "time"] }
winit = "0.30.13"
url = "2"
euclid = "0.22"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
