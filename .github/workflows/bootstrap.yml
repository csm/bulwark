name: Bootstrap
on: [push, pull_request]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo run --locked --no-default-features
      - run: cargo run --locked --no-default-features -- --headless-smoke
      - run: cargo run --locked --no-default-features -- --interpreter --headless-smoke
      - run: python3 experiments/run_product_nrepl.py
      - run: python3 experiments/run_product_nrepl.py --interpreter
      - run: cargo run --locked -p bulwark-experiment-e2
      - run: cargo build --locked -p bulwark-experiment-e1 -p bulwark-experiment-e7
      - run: python3 experiments/run_e1.py --seconds 5
      - run: cargo run --locked -p bulwark-experiment-e6
      - run: python3 experiments/run_e6.py
      - run: python3 experiments/run_e7.py
      - run: python3 experiments/run_e7.py --require-keyword-await
      - run: cargo run --locked -p bulwark-experiment-e7 --example gc_idle -- --baseline --require-idle
      - run: cargo run --locked -p bulwark-experiment-e7 --example gc_idle -- --require-idle
      - run: python3 experiments/run_e7_nrepl.py
  servo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Servo build and software display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build pkg-config xvfb \
            libfontconfig1-dev libfreetype-dev libglib2.0-dev libudev-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libunwind-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo clippy --locked -p bulwark-shell -p bulwark-engine-servo --features native,servo --all-targets -- -D warnings
      - run: xvfb-run -a cargo test --locked -p bulwark-shell -p bulwark-engine-servo --features native,servo
      - run: xvfb-run -a cargo run --locked --features native -- --servo-smoke
      - run: xvfb-run -a cargo run --locked -- --interpreter --servo-smoke
      - run: xvfb-run -a cargo run --locked -- --close-after-ms 1000
      - run: cargo build --locked -p bulwark-shell --features native
      - run: xvfb-run -a python3 experiments/run_product_native.py
      - run: xvfb-run -a python3 experiments/run_product_native.py --interpreter
      - run: xvfb-run -a python3 experiments/run_product_nrepl.py --native
      - run: xvfb-run -a python3 experiments/run_product_nrepl.py --native --interpreter
