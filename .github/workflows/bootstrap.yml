name: Bootstrap
on: [push, pull_request]
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked
      - run: cargo run --locked -- --headless-smoke
      - run: cargo run --locked -p bulwark-experiment-e2
      - run: cargo build --locked -p bulwark-experiment-e1 -p bulwark-experiment-e7
      - run: python3 experiments/run_e1.py --seconds 5
      - run: cargo run --locked -p bulwark-experiment-e6
      - run: python3 experiments/run_e6.py
      - run: python3 experiments/run_e7.py
      - run: python3 experiments/run_e7.py --require-keyword-await
      - run: cargo run --locked -p bulwark-experiment-e7 --example gc_idle -- --baseline --require-idle
      - run: cargo run --locked -p bulwark-experiment-e7 --example gc_idle -- --require-idle
      - run: python3 experiments/run_e7_nrepl.py
  servo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Servo build and software display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build pkg-config xvfb \
            libfontconfig1-dev libfreetype-dev libglib2.0-dev libudev-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libunwind-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo clippy --locked -p bulwark-shell -p bulwark-engine-servo --features native,servo --all-targets -- -D warnings
      - run: cargo test --locked -p bulwark-shell --features native
      - run: xvfb-run -a cargo test --locked -p bulwark-engine-servo --features servo
      - run: xvfb-run -a cargo run --locked --features servo -- --servo-smoke
      - run: cargo build --locked -p bulwark-shell --features native
      - run: xvfb-run -a python3 experiments/run_product_native.py
