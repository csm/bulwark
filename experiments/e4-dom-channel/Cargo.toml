[package]
name = "bulwark-experiment-e4"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
servo = ["dep:servo"]
# Only build against the isolated P3.1 engine patch, never the product pin.
document-scope = ["servo"]

[[bin]]
name = "bulwark-experiment-e4"
path = "src/main.rs"
required-features = ["servo"]

[dependencies]
anyhow.workspace = true
servo = { workspace = true, optional = true }
url.workspace = true
rustls.workspace = true
serde_json = "1"
